name: CI

on:
  push:
    branches-ignore: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "4.0"
          - "3.4"
          - "3.3"
          - "3.2"
          - "3.1"
          - "3.0"
          - "2.7"
          - "head"
          - "jruby"
          - "jruby-head"
          - "truffleruby"
          - "truffleruby-head"

    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get install -y --no-install-recommends redis-server
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bin/rake
